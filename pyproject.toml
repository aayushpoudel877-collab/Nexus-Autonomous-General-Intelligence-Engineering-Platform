[project]
name = "nexus-platform"
version = "0.18.0"
description = "Autonomous General Intelligence Engineering Platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "PyJWT>=2.9,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "email-validator>=2.2,<3.0",
  "cryptography>=43,<47",
]
[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.6,<1.0",
  "aiosqlite>=0.20,<1.0",
]
[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["services*", "packages*"]

[tool.ruff.lint]
ignore = ["B008", "UP017"]
