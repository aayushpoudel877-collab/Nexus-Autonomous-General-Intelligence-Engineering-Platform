name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - name: Run offline RAG evaluation release gate
        run: python -m services.rag.evaluation_cli --dataset tests/fixtures/rag/golden.jsonl --predictions tests/fixtures/rag/predictions.jsonl --grounding-dataset tests/fixtures/rag/grounding.jsonl --output rag-evaluation-report.json --k 1 --baseline baseline --candidate candidate
      - name: Archive RAG evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: rag-evaluation-report.json
          if-no-files-found: ignore
      - name: Run offline grounding calibration
        run: python -m services.rag.grounding_calibration_cli --output grounding-calibration-current.json
      - name: Enforce approved grounding calibration baseline when configured
        if: ${{ hashFiles('tests/fixtures/rag/grounding-calibration-baseline.json') != '' }}
        run: >-
          python -m services.rag.calibration_release_gate_cli
          --baseline-manifest tests/fixtures/rag/grounding-calibration-baseline.json
          --current grounding-calibration-current.json
          --output grounding-calibration-release-decision.json
      - name: Archive grounding calibration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounding-calibration-current-report
          path: grounding-calibration-current.json
          if-no-files-found: ignore
      - name: Archive grounding calibration release decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounding-calibration-release-decision
          path: grounding-calibration-release-decision.json
          if-no-files-found: ignore
      - name: Run offline prompt-injection evaluation
        run: python -m services.rag.prompt_injection_cli --dataset tests/fixtures/rag/prompt-injection-eval.jsonl --output prompt-injection-report.json
      - name: Archive prompt-injection evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-injection-evaluation-report
          path: prompt-injection-report.json
          if-no-files-found: ignore
      - name: Run offline tool-plan evaluation
        run: python -m services.rag.tool_plan_evaluation_cli --dataset tests/fixtures/rag/tool-plan-eval.jsonl --output tool-plan-report.json
      - name: Archive tool-plan evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tool-plan-evaluation-report
          path: tool-plan-report.json
          if-no-files-found: ignore
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-audit --no-fund
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - name: Upgrade the complete schema
        run: alembic upgrade head
      - name: Verify every migration can be downgraded
        run: alembic downgrade base
      - name: Rebuild the schema from a clean database
        run: alembic upgrade head
      - name: Exercise PostgreSQL-backed RAG audit idempotency and concurrency
        run: pytest -q tests/test_rag_phase53_postgres_idempotency.py
      - name: Confirm one current migration head
        run: alembic current

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build API image with document extraction dependencies
        run: docker build -f services/api/Dockerfile -t nexus-api-ci .
      - name: Build execution worker image
        run: docker build -f services/execution/Dockerfile -t nexus-execution-ci .
      - name: Build workflow orchestrator image
        run: docker build -f services/orchestrator/Dockerfile -t nexus-orchestrator-ci .
