name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - name: Run offline RAG evaluation release gate
        run: python -m services.rag.evaluation_cli --dataset tests/fixtures/rag/golden.jsonl --predictions tests/fixtures/rag/predictions.jsonl --grounding-dataset tests/fixtures/rag/grounding.jsonl --output rag-evaluation-report.json --k 1 --baseline baseline --candidate candidate
      - name: Archive RAG evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-evaluation-report
          path: rag-evaluation-report.json
          if-no-files-found: ignore
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-audit --no-fund
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus@localhost:5432/nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e .
      - name: Upgrade the complete schema
        run: alembic upgrade head
      - name: Verify every migration can be downgraded
        run: alembic downgrade base
      - name: Rebuild the schema from a clean database
        run: alembic upgrade head
      - name: Confirm one current migration head
        run: alembic current
