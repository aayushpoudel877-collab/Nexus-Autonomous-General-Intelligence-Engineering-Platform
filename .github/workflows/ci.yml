name: CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - name: Run offline RAG evaluation release gate
        run: python -m services.rag.evaluation_cli --dataset tests/fixtures/rag/golden.jsonl --predictions tests/fixtures/rag/predictions.jsonl --output rag-evaluation-report.json --k 1 --baseline baseline --candidate candidate
  web:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: apps/web}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install --no-audit --no-fund
      - run: npm run build
