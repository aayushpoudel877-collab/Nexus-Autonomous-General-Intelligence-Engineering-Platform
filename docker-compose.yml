services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    ports: ["5432:5432"]
    volumes: [nexus_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379/0
      NEXUS_SECRET_KEY: ${NEXUS_SECRET_KEY:-replace-with-a-development-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      NEXUS_ALLOWED_HOSTS: ${NEXUS_ALLOWED_HOSTS:-localhost,127.0.0.1}
      NEXUS_ARTIFACT_ROOT: /var/lib/nexus/artifacts
      NEXUS_RUNTIME_ROOT: /var/lib/nexus/runtime
    command: ["sh", "-c", "alembic upgrade head && uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    volumes:
      - nexus_artifacts:/var/lib/nexus/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
  worker:
    build:
      context: .
      dockerfile: services/execution/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://nexus:nexus@postgres:5432/nexus
      NEXUS_WORKER_POLL_SECONDS: ${NEXUS_WORKER_POLL_SECONDS:-2}
      NEXUS_WORKER_LEASE_SECONDS: ${NEXUS_WORKER_LEASE_SECONDS:-60}
      NEXUS_ARTIFACT_ROOT: /var/lib/nexus/artifacts
      NEXUS_RUNTIME_ROOT: /var/lib/nexus/runtime
      NEXUS_SANDBOX_LAUNCH_ENABLED: ${NEXUS_SANDBOX_LAUNCH_ENABLED:-false}
      NEXUS_DOCKER_BINARY: ${NEXUS_DOCKER_BINARY:-docker}
      NEXUS_SANDBOX_STOP_GRACE_SECONDS: ${NEXUS_SANDBOX_STOP_GRACE_SECONDS:-3}
      NEXUS_SANDBOX_IMAGE: ${NEXUS_SANDBOX_IMAGE:-}
    command: ["python", "-m", "services.execution.worker"]
    volumes:
      - nexus_artifacts:/var/lib/nexus/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  nexus_pg:
  nexus_artifacts:
